<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="banqiao bee 3d guide state map">
  <defs>
    <style>
      .bg{fill:#0c0f14}
      .node{fill:#151a22;stroke:#32404f;stroke-width:2}
      .hot{fill:#171d27;stroke:#e0b14f;stroke-width:3}
      .t1{fill:#f5efe4;font:700 24px Arial, sans-serif}
      .t2{fill:#cad3e1;font:400 15px Arial, sans-serif}
      .t3{fill:#e0b14f;font:700 16px Arial, sans-serif}
      .line{stroke:#6d7886;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#6d7886"/>
    </marker>
  </defs>
  <rect width="1600" height="900" class="bg"/>
  <text x="60" y="72" class="t1">banqiao-bee-3d-guide 状态图</text>
  <text x="60" y="102" class="t2">从蜜蜂视频进入 3D 导览，再进入两个模型和五个数字艺术预设</text>

  <rect x="80" y="180" rx="20" ry="20" width="220" height="90" class="node"/>
  <text x="128" y="232" class="t3">video-intro</text>

  <rect x="360" y="180" rx="20" ry="20" width="220" height="90" class="hot"/>
  <text x="404" y="232" class="t3">bee-hotspot</text>

  <rect x="640" y="180" rx="20" ry="20" width="260" height="90" class="node"/>
  <text x="694" y="228" class="t3">guide-shell</text>

  <path d="M300 225H360" class="line"/>
  <path d="M580 225H640" class="line"/>

  <rect x="640" y="360" rx="20" ry="20" width="260" height="90" class="node"/>
  <text x="680" y="408" class="t3">banqiao-model</text>

  <rect x="940" y="360" rx="20" ry="20" width="260" height="90" class="node"/>
  <text x="974" y="408" class="t3">headdress-model</text>

  <path d="M770 270V360" class="line"/>
  <path d="M900 405H940" class="line"/>

  <rect x="790" y="550" rx="20" ry="20" width="300" height="90" class="node"/>
  <text x="856" y="598" class="t3">preset-switch</text>
  <path d="M770 450V550" class="line"/>
  <path d="M1070 450V550" class="line"/>

  <rect x="1130" y="550" rx="20" ry="20" width="250" height="90" class="node"/>
  <text x="1178" y="598" class="t3">compare-mode</text>
  <path d="M1090 595H1130" class="line"/>

  <rect x="790" y="700" rx="20" ry="20" width="300" height="90" class="node"/>
  <text x="842" y="748" class="t3">handoff-ready</text>
  <path d="M940 640V700" class="line"/>

  <text x="1180" y="748" class="t2">完成后交给主流程整合</text>
  <path d="M1260 640V700" class="line"/>
</svg>
