<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 928" role="img" aria-labelledby="title desc">
  <title id="title">诉土桌边：枯叶灯与工作台蒸馏图</title>
  <desc id="desc">以暖色印块、工作台横线和材料点阵表现一盏枯叶灯托住工作台交流的关系。</desc>
  <defs>
    <filter id="rough" x="-12%" y="-18%" width="124%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="23" result="g" />
      <feColorMatrix in="g" type="saturate" values="0" />
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#282821" opacity=".55" />
      <circle cx="13" cy="12" r="1.5" fill="#282821" opacity=".28" />
    </pattern>
  </defs>
  <rect width="1400" height="928" fill="#e9e3d5" />
  <rect width="1400" height="928" fill="#cbbda6" opacity=".18" filter="url(#grain)" />
  <path d="M115 180 C330 124 520 155 642 244 C730 308 790 308 875 255 C990 183 1180 215 1288 315 L1288 510 C1112 462 951 469 810 544 C635 636 390 617 115 505 Z" fill="#d98a1d" opacity=".93" filter="url(#rough)" />
  <path d="M171 207 C349 171 500 192 616 267 C723 336 786 345 885 279" fill="none" stroke="#f6c454" stroke-width="24" opacity=".75" filter="url(#rough)" />
  <path d="M90 600 C300 572 470 584 636 605 C824 628 1031 606 1315 566" fill="none" stroke="#282821" stroke-width="16" opacity=".92" filter="url(#rough)" />
  <path d="M90 632 C310 603 502 615 690 638 C890 662 1090 636 1315 598" fill="none" stroke="#6f6759" stroke-width="5" opacity=".7" />
  <g fill="url(#dots)" opacity=".95">
    <circle cx="295" cy="690" r="53" />
    <circle cx="420" cy="732" r="31" />
    <circle cx="559" cy="681" r="42" />
    <circle cx="725" cy="736" r="25" />
    <circle cx="856" cy="683" r="45" />
    <circle cx="1040" cy="738" r="34" />
  </g>
  <g stroke="#282821" stroke-width="5" opacity=".78">
    <line x1="226" y1="760" x2="1170" y2="760" />
    <line x1="316" y1="795" x2="1080" y2="795" />
    <line x1="420" y1="830" x2="964" y2="830" />
  </g>
  <g fill="#282821" font-family="Courier New, monospace" font-size="18" letter-spacing="3">
    <text x="92" y="104">SONGZHUANG / MATERIAL RELATION</text>
    <text x="92" y="874">LAMP - TABLE - PAUSE</text>
    <text x="1110" y="104">NO. SZ-02</text>
  </g>
  <g stroke="#9e3b28" stroke-width="4" opacity=".9">
    <line x1="102" y1="128" x2="192" y2="128" />
    <line x1="102" y1="128" x2="102" y2="218" />
  </g>
</svg>
